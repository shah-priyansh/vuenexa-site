<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Render-blocking: mark the document JS-enabled before first paint so the
         scroll-reveal hidden state applies with no flash (and never hides content
         from no-JS crawlers, which never get the .js class). -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Fonts referenced by the literal font-family names in the ported inline
         styles ('Outfit', 'Space Grotesk', 'JetBrains Mono'). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Site-wide structured data (Organization + WebSite). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://vuenexa.com/#organization",
            "name": "VueNexa Enterprise",
            "url": "https://vuenexa.com",
            "logo": "https://vuenexa.com/icon.svg",
            "email": "tech@vuenexa.com",
            "telephone": "+91 72029 76525",
            "description": "VueNexa Enterprise builds custom software for firms and ships its own products for the textile industry — starting with real-time loom and machine monitoring.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Surat",
              "addressRegion": "Gujarat",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://vuenexa.com/#website",
            "name": "VueNexa Enterprise",
            "url": "https://vuenexa.com",
            "publisher": { "@id": "https://vuenexa.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
